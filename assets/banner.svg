<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#1b2a5c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#dfe6f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dfe6f5" stop-opacity="0"/>
    </radialGradient>
    <style>
      .star { fill:#fff; animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; }
      @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:1 } }
      .title { font-family: Georgia, 'Times New Roman', serif; fill:#dfe6f5; letter-spacing:6px; }
      .sub { font-family: Georgia, serif; fill:#e8c97a; letter-spacing:4px; font-style:italic; }
    </style>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <circle class="star" cx="80" cy="50" r="2"/>
  <circle class="star s2" cx="210" cy="120" r="1.5"/>
  <circle class="star s3" cx="330" cy="40" r="2"/>
  <circle class="star s4" cx="450" cy="90" r="1.5"/>
  <circle class="star" cx="600" cy="30" r="2"/>
  <circle class="star s3" cx="700" cy="140" r="1.5"/>
  <circle class="star s2" cx="820" cy="60" r="2"/>
  <circle class="star s4" cx="150" cy="230" r="1.5"/>
  <circle class="star" cx="780" cy="250" r="2"/>

  <!-- moon -->
  <circle cx="730" cy="95" r="90" fill="url(#glow)"/>
  <circle cx="730" cy="95" r="45" fill="#eef2fb"/>
  <circle cx="715" cy="85" r="8" fill="#cfd8ee"/>
  <circle cx="745" cy="108" r="5" fill="#cfd8ee"/>

  <!-- rotating magic circle -->
  <g transform="translate(160 150)" fill="none" stroke="#b3202f" stroke-width="1.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle r="100"/>
      <circle r="88" stroke-dasharray="4 6" stroke="#e8c97a"/>
      <polygon points="0,-88 76.2,44 -76.2,44"/>
      <polygon points="0,88 76.2,-44 -76.2,-44"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
      <circle r="45" stroke="#e8c97a"/>
      <circle r="30" stroke-dasharray="2 4"/>
    </g>
  </g>

  <text class="title" x="450" y="150" font-size="44" text-anchor="middle">ALFCHT</text>
  <text class="sub" x="450" y="190" font-size="18" text-anchor="middle">Game Developer · Witch of the Holy Night</text>
</svg>
