<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" shape-rendering="crispEdges">
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .head { font-size: 20px; fill: #e8c97a; letter-spacing: 8px; }
    .tag { font-size: 12px; fill: #8fa8e8; }
    .title { font-size: 16px; fill: #dfe6f5; }
    .info { font-size: 13px; fill: #dfe6f5; }
    .stat { font-size: 13px; fill: #e8c97a; }

    /* 12s loop, 3 slots, 4s each: hold, then slide left in 1s */
    .card { animation: slide 12s linear infinite; }
    @keyframes slide {
      0%      { transform: translateX(730px); opacity: 0; animation-timing-function: steps(1) }
      3%      { transform: translateX(730px); opacity: .55 }
      25%     { transform: translateX(730px); opacity: .55; animation-timing-function: steps(6) }
      33.33%  { transform: translateX(450px); opacity: 1 }
      58.33%  { transform: translateX(450px); opacity: 1; animation-timing-function: steps(6) }
      66.66%  { transform: translateX(170px); opacity: .55 }
      91.66%  { transform: translateX(170px); opacity: .55; animation-timing-function: steps(6) }
      100%    { transform: translateX(-110px); opacity: 0 }
    }

    /* engine + status only show while the slot is centered */
    .det { animation: det 12s steps(1) infinite; }
    @keyframes det { 0% { opacity: 0 } 33.33% { opacity: 1 } 58.33% { opacity: 0 } 100% { opacity: 0 } }

    /* gold frame only while centered */
    .frame { animation: frame 12s steps(1) infinite; }
    @keyframes frame { 0% { stroke: #1b2a5c } 33.33% { stroke: #e8c97a } 58.33% { stroke: #1b2a5c } 100% { stroke: #1b2a5c } }

    /* phase shifts so slot 1 starts centered */
    .s1, .s1 .det, .s1 .frame { animation-delay: -4s; }
    .s2, .s2 .det, .s2 .frame { animation-delay: 0s; }
    .s3, .s3 .det, .s3 .frame { animation-delay: -8s; }

    .blink { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 0% { opacity: 1 } 50% { opacity: .15 } 100% { opacity: 1 } }
  </style>

  <!-- panel -->
  <rect x="12" y="12" width="876" height="206" fill="#0b1026" stroke="#e8c97a" stroke-width="4"/>
  <text class="t head" x="450" y="46" text-anchor="middle">SELECT SAVE SLOT</text>

  <!-- SLOT 1: Vertical Slice -->
  <g class="card s1">
    <rect class="frame" x="-110" y="62" width="220" height="120" fill="#07040d" stroke-width="4"/>
    <text class="t tag" x="-94" y="84">SLOT 01</text>
    <text class="t title" x="0" y="116" text-anchor="middle">VERTICAL SLICE</text>
    <g class="det">
      <rect x="-94" y="128" width="188" height="2" fill="#e8c97a"/>
      <text class="t info" x="-94" y="150">ENGINE : UNITY</text>
      <text class="t stat" x="-94" y="170">STATUS : IN DEVELOPMENT</text>
    </g>
  </g>

  <!-- SLOT 2: Rewind-Time Puzzle -->
  <g class="card s2">
    <rect class="frame" x="-110" y="62" width="220" height="120" fill="#07040d" stroke-width="4"/>
    <text class="t tag" x="-94" y="84">SLOT 02</text>
    <text class="t title" x="0" y="116" text-anchor="middle">REWIND-TIME PUZZLE</text>
    <g class="det">
      <rect x="-94" y="128" width="188" height="2" fill="#e8c97a"/>
      <text class="t info" x="-94" y="150">ENGINE : UNITY</text>
      <text class="t stat" x="-94" y="170">STATUS : IN DEVELOPMENT</text>
    </g>
  </g>

  <!-- SLOT 3: Empty -->
  <g class="card s3">
    <rect class="frame" x="-110" y="62" width="220" height="120" fill="#07040d" stroke-width="4"/>
    <text class="t tag" x="-94" y="84">SLOT 03</text>
    <text class="t title" x="0" y="116" text-anchor="middle">[ EMPTY ]</text>
    <g class="det">
      <rect x="-94" y="128" width="188" height="2" fill="#e8c97a"/>
      <text class="t info" x="-94" y="150">ENGINE : UNREAL</text>
      <text class="t stat" x="-94" y="170">STATUS : SOON</text>
    </g>
  </g>

  <!-- arrows -->
  <g class="blink" fill="#e8c97a">
    <rect x="40" y="114" width="8" height="8"/><rect x="32" y="122" width="8" height="8"/>
    <rect x="24" y="130" width="8" height="8"/><rect x="32" y="138" width="8" height="8"/>
    <rect x="40" y="146" width="8" height="8"/>
    <rect x="852" y="114" width="8" height="8"/><rect x="860" y="122" width="8" height="8"/>
    <rect x="868" y="130" width="8" height="8"/><rect x="860" y="138" width="8" height="8"/>
    <rect x="852" y="146" width="8" height="8"/>
  </g>

  <!-- selector pointer under the center slot -->
  <g class="blink" fill="#b3202f">
    <rect x="446" y="188" width="8" height="8"/>
    <rect x="438" y="196" width="24" height="8"/>
  </g>
</svg>
