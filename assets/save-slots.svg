<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" shape-rendering="crispEdges">
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .head { font-size: 20px; fill: #e8c97a; letter-spacing: 8px; }
    .tag { font-size: 12px; fill: #8fa8e8; }
    .title { font-size: 16px; fill: #dfe6f5; }
    .info { font-size: 13px; fill: #dfe6f5; }
    .stat { font-size: 13px; fill: #e8c97a; }
    .up { fill: #8fa8e8; }

    /* 20s loop, 5 slots, 4s each: hold 3s, slide 1s.
       Each card goes: right -> center -> left -> hidden left -> hidden right (waiting) */
    .card { animation: slide 20s linear infinite; }
    @keyframes slide {
      0%   { transform: translateX(730px);  opacity: .55 }
      15%  { transform: translateX(730px);  opacity: .55; animation-timing-function: steps(6) }
      20%  { transform: translateX(450px);  opacity: 1 }
      35%  { transform: translateX(450px);  opacity: 1;   animation-timing-function: steps(6) }
      40%  { transform: translateX(170px);  opacity: .55 }
      55%  { transform: translateX(170px);  opacity: .55; animation-timing-function: steps(6) }
      60%  { transform: translateX(-110px); opacity: 0;   animation-timing-function: steps(1) }
      75%  { transform: translateX(1010px); opacity: 0 }
      95%  { transform: translateX(1010px); opacity: 0;   animation-timing-function: steps(6) }
      100% { transform: translateX(730px);  opacity: .55 }
    }

    /* engine + status only while centered */
    .det { animation: det 20s steps(1) infinite; }
    @keyframes det { 0% { opacity: 0 } 20% { opacity: 1 } 35% { opacity: 0 } 100% { opacity: 0 } }

    /* gold frame only while centered */
    .frame { animation: frame 20s steps(1) infinite; }
    @keyframes frame { 0% { stroke: #1b2a5c } 20% { stroke: #e8c97a } 35% { stroke: #1b2a5c } 100% { stroke: #1b2a5c } }

    /* phase shifts so slot 1 starts centered */
    .s1, .s1 .det, .s1 .frame { animation-delay: -4s; }
    .s2, .s2 .det, .s2 .frame { animation-delay: 0s; }
    .s3, .s3 .det, .s3 .frame { animation-delay: -16s; }
    .s4, .s4 .det, .s4 .frame { animation-delay: -12s; }
    .s5, .s5 .det, .s5 .frame { animation-delay: -8s; }

    .blink { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 0% { opacity: 1 } 50% { opacity: .15 } 100% { opacity: 1 } }
  </style>

  <!-- panel -->
  <rect x="12" y="12" width="876" height="206" fill="#0b1026" stroke="#e8c97a" stroke-width="4"/>
  <text class="t head" x="450" y="46" text-anchor="middle">SELECT SAVE SLOT</text>

  <!-- SLOT 1 -->
  <g class="card s1">
    <rect class="frame"
