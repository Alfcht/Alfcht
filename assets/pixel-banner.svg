<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" shape-rendering="crispEdges">
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .tw { animation: tw 2s steps(2) infinite; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.4s; }
    @keyframes tw { 0% { opacity: 1 } 50% { opacity: .1 } 100% { opacity: 1 } }
    .blink { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 0% { opacity: 1 } 50% { opacity: 0 } 100% { opacity: 1 } }
    .orb { animation: orb 2s steps(1) infinite; }
    @keyframes orb { 0% { fill: #b3202f } 50% { fill: #e8c97a } 100% { fill: #b3202f } }
  </style>

  <!-- pixel sky bands -->
  <rect y="0"   width="900" height="40" fill="#050816"/>
  <rect y="40"  width="900" height="40" fill="#080d24"/>
  <rect y="80"  width="900" height="40" fill="#0b1230"/>
  <rect y="120" width="900" height="40" fill="#0f1a42"/>
  <rect y="160" width="900" height="40" fill="#142250"/>
  <rect y="200" width="900" height="40" fill="#1b2a5c"/>

  <!-- stars -->
  <rect class="tw"    x="60"  y="40"  width="4" height="4" fill="#fff"/>
  <rect class="tw d1" x="300" y="30"  width="4" height="4" fill="#fff"/>
  <rect class="tw d2" x="420" y="70"  width="4" height="4" fill="#e8c97a"/>
  <rect class="tw d3" x="560" y="40"  width="4" height="4" fill="#fff"/>
  <rect class="tw d2" x="840" y="90"  width="4" height="4" fill="#fff"/>
  <rect class="tw"    x="250" y="110" width="4" height="4" fill="#fff"/>
  <rect class="tw d1" x="620" y="150" width="4" height="4" fill="#e8c97a"/>
  <rect class="tw d3" x="90"  y="120" width="4" height="4" fill="#fff"/>
  <rect class="tw d2" x="780" y="200" width="4" height="4" fill="#fff"/>

  <!-- pixel moon -->
  <rect x="664" y="14" width="112" height="112" fill="#dfe6f5" opacity="0.08"/>
  <rect x="704" y="30"  width="32" height="8"  fill="#eef2fb"/>
  <rect x="688" y="38"  width="64" height="8"  fill="#eef2fb"/>
  <rect x="680" y="46"  width="80" height="48" fill="#eef2fb"/>
  <rect x="688" y="94"  width="64" height="8"  fill="#eef2fb"/>
  <rect x="704" y="102" width="32" height="8"  fill="#eef2fb"/>
  <rect x="696" y="54"  width="16" height="8"  fill="#cfd8ee"/>
  <rect x="728" y="72"  width="8"  height="8"  fill="#cfd8ee"/>
  <rect x="704" y="80"  width="8"  height="8"  fill="#cfd8ee"/>

  <!-- ground -->
  <rect y="234" width="900" height="66" fill="#04050f"/>
  <rect x="0"   y="226" width="260" height="8" fill="#04050f"/>
  <rect x="520" y="226" width="380" height="8" fill="#04050f"/>
  <rect x="640" y="218" width="200" height="8" fill="#04050f"/>

  <!-- pixel witch silhouette -->
  <rect x="168" y="154" width="8"  height="8" fill="#0a0d1f"/>
  <rect x="160" y="162" width="16" height="8" fill="#0a0d1f"/>
  <rect x="152" y="170" width="24" height="8" fill="#0a0d1f"/>
  <rect x="152" y="170" width="24" height="4" fill="#b3202f"/>
  <rect x="128" y="178" width="56" height="8" fill="#0a0d1f"/>
  <rect x="144" y="186" width="32" height="8" fill="#0a0d1f"/>
  <rect x="156" y="190" width="4"  height="4" fill="#e8c97a"/>
  <rect x="136" y="194" width="40" height="8" fill="#0a0d1f"/>
  <rect x="128" y="202" width="56" height="16" fill="#0a0d1f"/>
  <rect x="120" y="218" width="72" height="8" fill="#0a0d1f"/>
  <rect x="112" y="226" width="88" height="8" fill="#0a0d1f"/>
  <!-- staff + glowing orb -->
  <rect x="208" y="170" width="4" height="64" fill="#2a1f3a"/>
  <rect class="orb" x="204" y="158" width="12" height="12" fill="#b3202f"/>

  <!-- title -->
  <text class="t" x="453" y="123" font-size="40" fill="#b3202f" text-anchor="middle">ALFCHT</text>
  <text class="t" x="450" y="120" font-size="40" fill="#e8c97a" text-anchor="middle">ALFCHT</text>
  <text class="t" x="450" y="156" font-size="14" fill="#dfe6f5" text-anchor="middle" letter-spacing="2">EVERYTHING DEVELOPER</text>
  <text class="t blink" x="450" y="205" font-size="16" fill="#dfe6f5" text-anchor="middle">- UNDER DEVELOPMENT -</text>
</svg>
